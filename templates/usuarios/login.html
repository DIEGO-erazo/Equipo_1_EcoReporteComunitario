{% extends "base.html" %}
{% block titulo %}Ingresar{% endblock %}
{% block contenido %}
<div class="card border-0 shadow-sm formulario-angosto">
  <div class="card-body p-4">
    <h1 class="h3 mb-3">Ingresar</h1>
    {% include "parciales/botones_sociales.html" %}
    <form method="post">
      {% csrf_token %}
      {% include "parciales/formulario.html" %}
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit" class="btn btn-primary w-100 mb-3">Ingresar</button>
    </form>
    <p class="text-center mb-2"><a href="{% url 'usuarios:recuperar' %}">¿Olvidaste tu contraseña?</a></p>
    <p class="mb-0 text-center">¿No tienes cuenta? <a href="{% url 'usuarios:registro' %}">Regístrate</a></p>
  </div>
</div>
{% endblock %}
