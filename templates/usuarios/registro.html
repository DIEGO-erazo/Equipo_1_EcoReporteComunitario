{% extends "base.html" %}
{% block titulo %}Crear cuenta{% endblock %}
{% block contenido %}
<div class="card border-0 shadow-sm formulario-angosto">
  <div class="card-body p-4">
    <h1 class="h3 mb-3">Crear cuenta</h1>
    {% include "parciales/botones_sociales.html" %}
    <form method="post">
      {% csrf_token %}
      {% include "parciales/formulario.html" %}
      <button type="submit" class="btn btn-primary w-100 mb-3">Crear cuenta</button>
    </form>
    <p class="mb-0 text-center">¿Ya tienes cuenta? <a href="{% url 'login' %}">Ingresa</a></p>
  </div>
</div>
{% endblock %}
