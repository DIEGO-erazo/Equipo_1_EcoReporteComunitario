{% extends "base.html" %}
{% block titulo %}Cambiar contraseña{% endblock %}
{% block contenido %}
<div class="card border-0 shadow-sm formulario-angosto">
  <div class="card-body p-4">
    <h1 class="h3 mb-3">Cambiar contraseña</h1>
    <form method="post">
      {% csrf_token %}
      {% include "parciales/formulario.html" %}
      <button type="submit" class="btn btn-primary w-100">Cambiar contraseña</button>
    </form>
  </div>
</div>
{% endblock %}
