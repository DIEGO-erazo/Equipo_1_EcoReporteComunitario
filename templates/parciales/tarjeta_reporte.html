{% load humanize %}
<article class="tarjeta">
  <a href="{{ reporte.get_absolute_url }}" class="tarjeta-imagen">
    {% with foto=reporte.evidencias.all.0 %}
      {% if foto %}<img src="{{ foto.url_imagen.url }}" alt="Foto del reporte" loading="lazy">
      {% else %}<span class="sin-foto">🍃</span>{% endif %}
    {% endwith %}
  </a>
  <div class="tarjeta-cuerpo">
    <div class="etiquetas">
      <span class="etiqueta estado-{{ reporte.id_estado.clase_css }}">{{ reporte.id_estado }}</span>
      <span class="etiqueta categoria">{{ reporte.id_categoria }}</span>
    </div>
    <h3><a href="{{ reporte.get_absolute_url }}">{{ reporte.titulo }}</a></h3>
    <p class="lugar">📍 {{ reporte.ubicacion_direccion }}</p>
    <p class="fecha">{{ reporte.fecha_reporte|naturaltime }}</p>
  </div>
</article>
